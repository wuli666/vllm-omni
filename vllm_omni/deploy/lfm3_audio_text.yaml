# LFM3-Audio: speech / text in -> text out (ASR, spoken QA), single GPU.
# Prompts carry one <|audio|> per clip; see recipes/LiquidAI/LFM3-Audio.md.
pipeline: lfm3_audio_text
trust_remote_code: true
async_chunk: false
model_runner: v2

stages:
  - stage_id: 0
    devices: "0"
    max_num_seqs: 16
    gpu_memory_utilization: 0.5
    max_model_len: 8192
    max_num_batched_tokens: 8192
    # Omni prefix caching needs a single full-attention KV group; the hybrid
    # LFM3 backbone has conv, full and sliding attention groups.
    enable_prefix_caching: false
    default_sampling_params:
      temperature: 0.0
      max_tokens: 1024
