# LFM3-Audio: speech / text in -> text and speech out, single GPU.
# Stage 0 (language model + depth decoder) streams 12-codebook frames to the
# Liquid codec (stage 1) in windows of 2, 4 and 8 frames for an early first
# packet, then 12 frames (~1 s). Prompts end on <|audio_start|> (speech) or
# <|mixed_start|> (interleaved text and speech); see recipes/LiquidAI/LFM3-Audio.md.
model_runner: v2
async_chunk: true
trust_remote_code: true

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      codec_streaming: true
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      codec_chunk_frames: 12
      codec_chunk_ramp: "2,4,8"

stages:
  - stage_id: 0
    devices: "0"
    max_num_seqs: 16
    gpu_memory_utilization: 0.5
    max_model_len: 8192
    max_num_batched_tokens: 8192
    # Omni prefix caching needs a single full-attention KV group; the hybrid
    # LFM3 backbone has conv, full and sliding attention groups.
    enable_prefix_caching: false
    output_connectors:
      to_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      max_tokens: 2048

  - stage_id: 1
    devices: "0"
    # The codec keeps one stream per request; the V1 generation runner passes its request ids.
    model_runner: v1
    max_num_seqs: 16
    gpu_memory_utilization: 0.1
    enforce_eager: true
    max_model_len: 8192
    max_num_batched_tokens: 8192
    enable_prefix_caching: false
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      max_tokens: 8192
